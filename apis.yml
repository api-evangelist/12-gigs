name: 12 Gigs
description: 12 Gigs, Inc. — later operating as Super Lucky Casino Inc. and renamed
  Super Free Games, Inc. — was a San Francisco-based mobile game developer founded
  in 2011. The studio began in social casino games (Super Lucky Casino) before pivoting
  to casual and word titles such as Word Collect, Word Nut and Trivia Star. It was
  acquired by Stillfront Group in December 2020 for approximately USD 150 million upfront
  and now operates as a Stillfront studio; its former superluckycasino.com domain now
  redirects to stillfront.com. The company exposes no public developer API, documentation,
  or SDK.
